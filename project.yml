# Mauna Xcode project, generated by XcodeGen.
# After adding or removing files, run:  xcodegen generate
# The generated Mauna.xcodeproj is not committed.

name: Mauna
options:
  bundleIdPrefix: in.throttlelabs
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
  xcodeVersion: "26.5"   # stops Xcode's "Update to recommended settings" prompt

settings:
  base:
    # Xcode 26 recommended settings
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Mauna:
    type: application
    platform: macOS
    sources:
      - path: Mauna
    info:
      path: Mauna/Info.plist
      properties:
        CFBundleDisplayName: Mauna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true          # menu bar only, no Dock icon
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Throttle Labs"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.throttlelabs.mauna
        PRODUCT_NAME: Mauna
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"    # sign to run locally; a real team comes in Phase 1
        ENABLE_APP_SANDBOX: NO     # direct DMG distribution, see docs/ROADMAP.md
