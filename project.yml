# Mauna Xcode project, generated by XcodeGen.
# After adding or removing files, run:  xcodegen generate
# The generated Mauna.xcodeproj is not committed.

name: Mauna
options:
  bundleIdPrefix: in.throttlelabs
  deploymentTarget:
    macOS: "14.2"
  createIntermediateGroups: true
  xcodeVersion: "26.5"   # stops Xcode's "Update to recommended settings" prompt

settings:
  base:
    # Xcode 26 recommended settings
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0   # global shortcut without the Accessibility permission

targets:
  Mauna:
    type: application
    platform: macOS
    sources:
      - path: Mauna
        excludes: ["*.entitlements"]
    dependencies:
      - package: KeyboardShortcuts
    scheme:
      testTargets: [MaunaTests]
    info:
      path: Mauna/Info.plist
      properties:
        CFBundleDisplayName: Mauna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true          # menu bar only, no Dock icon
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Throttle Labs"
        NSAppleEventsUsageDescription: Mauna pauses, resumes and fades your music player. It never reads what you listen to.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.throttlelabs.mauna
        PRODUCT_NAME: Mauna
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 23495RS836   # a stable signature keeps the Automation permission across rebuilds
        CODE_SIGN_ENTITLEMENTS: Mauna/Mauna.entitlements
        ENABLE_HARDENED_RUNTIME: YES   # required for notarization (Phase 6)
        ENABLE_APP_SANDBOX: NO         # direct DMG distribution, see docs/ROADMAP.md

  # Mac App Store build of the same code: sandboxed, StoreKit for Pro. Compiles with APP_STORE.
  # The direct build above stays unsandboxed (Lemon Squeezy, Sparkle). See docs/ROADMAP.md › Phase 6.
  MaunaAppStore:
    type: application
    platform: macOS
    sources:
      - path: Mauna
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: KeyboardShortcuts
    scheme: {}
    info:
      path: AppStore/Info.plist
      properties:
        CFBundleDisplayName: Mauna
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Throttle Labs"
        NSAppleEventsUsageDescription: Mauna pauses, resumes and fades your music player. It never reads what you listen to.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.throttlelabs.mauna
        PRODUCT_NAME: MaunaAppStore   # own .app in the build folder; people still see "Mauna"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 23495RS836
        CODE_SIGN_ENTITLEMENTS: AppStore/Mauna.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP_STORE

  # Logic tests. Pure files are compiled straight in, so tests never launch Mauna or touch a player.
  MaunaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MaunaTests
      - path: Mauna/Rules/Rule.swift
      - path: Mauna/Rules/RuleEngine.swift
      - path: Mauna/Rules/QuietShortcut.swift
      - path: Mauna/Rules/Suggestions.swift
      - path: Mauna/DesignSystem/AudioTiming.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.throttlelabs.mauna.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 23495RS836
